name: hotel_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  equatable: ^2.0.8
  http: ^1.6.0
  dartz: ^0.10.1
  shared_preferences: ^2.5.5
  flutter_flip_card: ^0.0.6
  flip_card: ^0.7.0
  curved_navigation_bar: ^1.0.6
  smooth_page_indicator: ^2.0.1
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  flutter_local_notifications: ^20.1.0
  pinput: ^6.0.2
  sms_autofill: ^2.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "images/icon.png"
    min_sdk_android: 21
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "images/icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/PlayfairDisplay-Bold.ttf
          weight: 700